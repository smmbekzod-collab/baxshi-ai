name: Signed Android release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    strategy:
      matrix:
        include:
          - flavor: user
            target: lib/main.dart
          - flavor: admin
            target: lib/main_admin.dart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          chmod 600 "$RUNNER_TEMP/upload.jks"
      - run: flutter pub get --enforce-lockfile && flutter analyze && flutter test
        working-directory: mobile
      - name: Build signed APK and AAB
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          API_URL: ${{ vars.API_BASE_URL }}
        run: |
          test -n "$API_URL"
          case "$API_URL" in https://*) ;; *) exit 1 ;; esac
          flutter build apk --release --flavor ${{ matrix.flavor }} --target ${{ matrix.target }} --dart-define=API_BASE_URL="$API_URL"
          flutter build appbundle --release --flavor ${{ matrix.flavor }} --target ${{ matrix.target }} --dart-define=API_BASE_URL="$API_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: baxshi-${{ matrix.flavor }}-signed
          path: |
            mobile/build/app/outputs/flutter-apk/*-release.apk
            mobile/build/app/outputs/bundle/**/*.aab
          if-no-files-found: error
      - if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
